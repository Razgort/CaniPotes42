<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563EB" />
  <title>Accueil club — CaniFed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #dbeafe;
      --background: #fafafa;
      --card: #ffffff;
      --foreground: #18181b;
      --muted: #71717a;
      --border: #e4e4e7;
      --success: #16a34a;
      --success-light: #dcfce7;
      --warning: #d97706;
      --warning-light: #fef3c7;
      --danger: #dc2626;
      --danger-light: #fee2e2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--foreground);
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    /* Phone shell */
    .phone {
      width: 390px;
      min-height: 100vh;
      background: var(--background);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 0 1px #cbd5e1, 0 20px 60px rgba(0,0,0,.15);
    }
    @media (max-width: 420px) { .phone { width: 100%; box-shadow: none; } }

    /* AppShell header */
    .app-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      gap: 8px;
    }
    .club-logo {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 13px;
      flex-shrink: 0;
    }
    .club-name {
      font-weight: 600;
      font-size: 15px;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .icon-btn {
      width: 36px; height: 36px;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--primary-light); color: var(--primary); }

    /* Segments */
    .segments {
      display: flex;
      padding: 12px 16px 8px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      gap: 4px;
    }
    .seg-btn {
      flex: 1;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: var(--muted);
      transition: all .15s;
    }
    .seg-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    /* Event list */
    .event-list {
      flex: 1;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    /* Event card */
    .event-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      gap: 12px;
      padding: 14px;
      cursor: pointer;
      transition: box-shadow .15s, transform .1s;
      text-decoration: none;
      color: inherit;
    }
    .event-card:hover { box-shadow: 0 2px 12px rgba(37,99,235,.10); transform: translateY(-1px); }
    .event-card:active { transform: scale(.99); }

    /* Date block */
    .event-date {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-width: 42px;
      padding-top: 2px;
    }
    .date-day {
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      color: var(--primary);
    }
    .date-month {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      margin-top: 2px;
    }
    .date-weekday {
      font-size: 10px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* Card content */
    .event-content { flex: 1; min-width: 0; }
    .event-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .event-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
    }
    .event-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .rsvp-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all .15s;
    }
    .rsvp-going { background: var(--success-light); color: var(--success); border-color: #bbf7d0; }
    .rsvp-maybe { background: var(--warning-light); color: var(--warning); border-color: #fde68a; }
    .rsvp-none  { background: #f4f4f5; color: var(--muted); border-color: var(--border); }
    .rsvp-chip:hover { filter: brightness(.96); }

    .participants-count {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .avatar-stack {
      display: flex;
    }
    .avatar-xs {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--card);
      display: flex; align-items: center; justify-content: center;
      font-size: 8px;
      font-weight: 700;
      color: white;
      margin-left: -4px;
    }
    .avatar-xs:first-child { margin-left: 0; }

    /* Map thumb */
    .map-thumb {
      width: 52px; height: 52px;
      border-radius: 8px;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
      background: #e0f2fe;
      align-self: flex-start;
      margin-top: 2px;
    }
    .map-thumb-bg {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #bfdbfe 0%, #93c5fd 50%, #60a5fa 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .map-pin { font-size: 20px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.3)); }

    /* Draft badge */
    .badge-draft {
      display: inline-flex;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      background: #f4f4f5;
      color: var(--muted);
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 80px;
      right: calc(50% - 195px + 16px);
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: none;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(37,99,235,.4);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
      z-index: 20;
    }
    .fab:hover { background: var(--primary-hover); transform: scale(1.06); }
    .fab:active { transform: scale(.97); }
    @media (max-width: 420px) { .fab { right: 16px; } }

    /* Bottom nav */
    .bottom-nav {
      display: flex;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 6px 0 12px;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px;
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: inherit;
      color: var(--muted);
      font-size: 10px;
      transition: color .15s;
    }
    .nav-item.active { color: var(--primary); }
    .nav-icon { font-size: 20px; }

    /* Dropdown menu */
    .dropdown {
      position: absolute;
      top: 54px; right: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      z-index: 50;
      min-width: 180px;
      overflow: hidden;
      display: none;
    }
    .dropdown.open { display: block; }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 13px;
      transition: background .1s;
    }
    .dropdown-item:hover { background: var(--primary-light); }
    .dropdown-item + .dropdown-item { border-top: 1px solid var(--border); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: all .25s;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Section label */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      padding: 4px 0 6px;
    }

    /* Past events muted */
    .past .event-title { color: var(--muted); }
    .past .date-day { color: var(--muted); }
  </style>
</head>
<body>
<div class="phone">

  <!-- App header -->
  <header class="app-header" id="app-header">
    <div class="club-logo">CC</div>
    <span class="club-name" id="club-name">CaniCross Lyon</span>
    <button class="icon-btn" title="Changer de club" onclick="showToast('Sélecteur de clubs (prototype 05-club-switcher)')">⇄</button>
    <button class="icon-btn" id="admin-menu-btn" title="Menu admin" onclick="toggleDropdown()">⋯</button>

    <!-- Dropdown -->
    <div class="dropdown" id="admin-dropdown">
      <div class="dropdown-item" onclick="showToast('→ Créer un événement (02-event-create.html)'); toggleDropdown()">
        <span>➕</span> Créer un événement
      </div>
      <div class="dropdown-item" onclick="showToast('→ Paramètres club'); toggleDropdown()">
        <span>⚙️</span> Paramètres du club
      </div>
    </div>
  </header>

  <!-- Segments -->
  <div class="segments">
    <button class="seg-btn active" id="seg-upcoming" onclick="switchSegment('upcoming')">À venir</button>
    <button class="seg-btn" id="seg-past" onclick="switchSegment('past')">Passés</button>
  </div>

  <!-- Event list -->
  <div class="event-list" id="event-list"></div>

  <!-- FAB admin -->
  <button class="fab" title="Créer un événement" onclick="showToast('→ Créer un événement (02-event-create.html)')">+</button>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-item active">
      <span class="nav-icon">🗓</span>Événements
    </button>
    <button class="nav-item" onclick="showToast('→ Chat (prototype à venir)')">
      <span class="nav-icon">💬</span>Chat
    </button>
    <button class="nav-item" onclick="showToast('→ Membres')">
      <span class="nav-icon">👥</span>Membres
    </button>
    <button class="nav-item" onclick="showToast('→ Mon profil')">
      <span class="nav-icon">🐾</span>Moi
    </button>
  </nav>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const EVENTS_UPCOMING = [
    {
      day: '26', month: 'Mar', weekday: 'Mer',
      title: 'Entraînement canicross — Parc Miribel',
      location: 'Parc Miribel-Jonage, Lyon',
      time: '18:30',
      showMap: true,
      rsvp: 'going',
      participants: 14,
      colors: ['#2563eb','#16a34a','#d97706','#9333ea'],
      initials: ['J','M','T','A'],
    },
    {
      day: '29', month: 'Mar', weekday: 'Sam',
      title: 'Canitrail Forêt de Sénart — Compétition FFSLC',
      location: 'Parking du Carrefour, Brunoy',
      time: '08:00',
      showMap: true,
      rsvp: 'maybe',
      participants: 8,
      colors: ['#dc2626','#2563eb','#16a34a'],
      initials: ['P','J','S'],
    },
    {
      day: '05', month: 'Avr', weekday: 'Sam',
      title: 'Sortie rando chiens — Monts du Lyonnais',
      location: 'Place du village, Saint-Martin-en-Haut',
      time: '09:00',
      showMap: false,
      rsvp: 'none',
      participants: 5,
      colors: ['#9333ea','#2563eb'],
      initials: ['B','C'],
    },
    {
      day: '12', month: 'Avr', weekday: 'Sam',
      title: 'Séance vidéo-analyse — technique de traction',
      location: 'Salle associative, 12 rue des Sports, Lyon 8',
      time: '14:00',
      showMap: false,
      rsvp: 'none',
      participants: 0,
      colors: [],
      initials: [],
      draft: true,
    },
  ];

  const EVENTS_PAST = [
    {
      day: '15', month: 'Mar', weekday: 'Sam',
      title: 'Entraînement canicross — Parc Miribel',
      location: 'Parc Miribel-Jonage, Lyon',
      time: '18:30',
      showMap: true,
      rsvp: 'going',
      participants: 11,
      colors: ['#2563eb','#16a34a','#d97706'],
      initials: ['J','M','T'],
      past: true,
    },
    {
      day: '08', month: 'Mar', weekday: 'Sam',
      title: 'Race Canilyon #3 — Résultats',
      location: 'Domaine de Lacroix-Laval',
      time: '08:30',
      showMap: true,
      rsvp: 'going',
      participants: 22,
      colors: ['#2563eb','#dc2626','#9333ea','#16a34a'],
      initials: ['J','P','R','M'],
      past: true,
    },
  ];

  let currentSegment = 'upcoming';

  function rsvpLabel(rsvp) {
    if (rsvp === 'going')  return { text: '✓ Je viens', cls: 'rsvp-going' };
    if (rsvp === 'maybe') return { text: '~ Peut-être', cls: 'rsvp-maybe' };
    return { text: '? Participer', cls: 'rsvp-none' };
  }

  function renderEvents(events) {
    const list = document.getElementById('event-list');
    if (!events.length) {
      list.innerHTML = `<div style="text-align:center;padding:48px 24px;color:var(--muted)">
        <div style="font-size:40px;margin-bottom:12px">🐾</div>
        <div style="font-weight:600;font-size:15px;margin-bottom:6px">Aucun événement à venir</div>
        <div style="font-size:13px">Quand votre club en publie, ils apparaîtront ici.</div>
      </div>`;
      return;
    }
    list.innerHTML = '';
    if (currentSegment === 'past') {
      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.textContent = 'Événements passés';
      list.appendChild(lbl);
    }
    events.forEach((ev, i) => {
      const r = rsvpLabel(ev.rsvp);
      const avatars = ev.colors.slice(0,4).map((c,j) =>
        `<div class="avatar-xs" style="background:${c}">${ev.initials[j]||'?'}</div>`).join('');
      const mapThumb = ev.showMap ? `
        <div class="map-thumb">
          <div class="map-thumb-bg"><span class="map-pin">📍</span></div>
        </div>` : '';
      const draftBadge = ev.draft ? `<span class="badge-draft">Brouillon</span>` : '';
      const card = document.createElement('div');
      card.className = 'event-card' + (ev.past ? ' past' : '');
      card.innerHTML = `
        <div class="event-date">
          <div class="date-day">${ev.day}</div>
          <div class="date-month">${ev.month}</div>
          <div class="date-weekday">${ev.weekday}</div>
        </div>
        <div class="event-content">
          <div class="event-title">${ev.title}</div>
          <div class="event-meta">📍 ${ev.location}</div>
          <div class="event-footer">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <button class="rsvp-chip ${r.cls}" onclick="handleRsvp(event, ${i})">${r.text}</button>
              ${draftBadge}
            </div>
            <div class="participants-count">
              <div class="avatar-stack">${avatars}</div>
              ${ev.participants > 0 ? `<span>${ev.participants}</span>` : ''}
            </div>
          </div>
        </div>
        ${mapThumb}
      `;
      card.addEventListener('click', () => openEvent(ev));
      list.appendChild(card);
    });
  }

  function handleRsvp(e, idx) {
    e.stopPropagation();
    const events = currentSegment === 'upcoming' ? EVENTS_UPCOMING : EVENTS_PAST;
    const ev = events[idx];
    const cycle = { none: 'going', going: 'maybe', maybe: 'none' };
    ev.rsvp = cycle[ev.rsvp] || 'none';
    renderEvents(events);
    showToast(ev.rsvp === 'going' ? '✓ Participation confirmée' : ev.rsvp === 'maybe' ? '~ Réponse : Peut-être' : 'Participation annulée');
  }

  function openEvent(ev) {
    showToast(`→ Détail : ${ev.title} (03-event-detail.html)`);
  }

  function switchSegment(seg) {
    currentSegment = seg;
    document.getElementById('seg-upcoming').classList.toggle('active', seg === 'upcoming');
    document.getElementById('seg-past').classList.toggle('active', seg === 'past');
    renderEvents(seg === 'upcoming' ? EVENTS_UPCOMING : EVENTS_PAST);
  }

  function toggleDropdown() {
    document.getElementById('admin-dropdown').classList.toggle('open');
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('#admin-menu-btn') && !e.target.closest('#admin-dropdown')) {
      document.getElementById('admin-dropdown').classList.remove('open');
    }
  });

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  // Init
  renderEvents(EVENTS_UPCOMING);
</script>
</body>
</html>
